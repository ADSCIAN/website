- text:
    en: "One sometimes finds what one is not looking for."
    fr: "On trouve parfois ce que l'on ne cherche pas."
    nl: "Soms vindt men wat men niet zoekt."
  author: "Alexander Fleming"
- text:
    en: "Scientific discovery frequently begins with the awareness of anomaly."
    fr: "La découverte scientifique commence fréquemment par la conscience d'une anomalie."
    nl: "Wetenschappelijke ontdekking begint vaak met het bewustzijn van een anomalie."
  author: "Thomas Kuhn"
- text:
    en: "We learn from our mistakes."
    fr: "Nous apprenons de nos erreurs."
    nl: "Wij leren van onze fouten."
  author: "Karl Popper"
- text:
    en: "If you do not expect the unexpected, you will not find it."
    fr: "Si vous ne vous attendez pas à l'inattendu, vous ne le trouverez pas."
    nl: "Als je het onverwachte niet verwacht, zul je het niet vinden."
  author: "Heraclitus"
- text:
    en: "I was taught that the way of progress was neither swift nor easy."
    fr: "On m'a enseigné que le chemin du progrès n'était ni rapide ni facile."
    nl: "Mij is geleerd dat de weg naar vooruitgang noch snel noch gemakkelijk was."
  author: "Marie Curie"
